org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Pinned project-side (overrides the user-level gradle.properties AND any
# JAVA_HOME an editor extension injects into the spawning environment —
# the redhat.java VS Code extension bundles its own stripped JRE (no
# jlink) for its language server, and on every extension update it has
# spawned a fresh Gradle daemon pinned to that JRE, silently reused by
# every later `flutter run`/`flutter build` launched from VS Code until
# manually killed). This is read by Gradle's own launcher before any
# daemon-reuse matching, independent of VS Code or the shell.
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home
