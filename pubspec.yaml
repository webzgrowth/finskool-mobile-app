name: finskool
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.2


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^18.0.1

  shared_preferences: ^2.5.3
  dartz: ^0.10.1
  dio: ^5.9.0
  equatable: ^2.0.7
  image_picker: ^1.1.2
  cached_network_image: ^4.0.0
  flutter_svg: ^2.1.0
  intl: ^0.20.2
  google_sign_in: ^7.2.0
  device_info_plus: ^13.2.0
  permission_handler: ^13.0.2
  get_storage: ^2.1.1
  get_it: ^8.0.3
  logging: ^1.3.0

  # Bloc Dependencies
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  injectable: ^3.0.0
  freezed_annotation: ^3.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.16.1
  injectable_generator: ^3.1.3
  freezed: ^4.0.1

  flutter_lints: ^6.0.0


flutter:


  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  # Variable fonts: one asset per family, no `weight:` key.
  # Weights are selected at runtime via TextStyle.fontVariations.
  fonts:
    - family: Manrope
      fonts:
        - asset: fonts/manrope/Manrope[wght].ttf
    - family: Inter
      fonts:
        - asset: fonts/inter/Inter[opsz,wght].ttf

